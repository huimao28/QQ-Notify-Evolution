name: Android CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'fastlane/**'
    tags-ignore:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'fastlane/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Assemble
      run: ./gradlew assemble

    - name: Build And Test
      run: ./gradlew build

    - name: Upload bubble probe debug APK
      uses: actions/upload-artifact@v4
      with:
        name: qq-bubble-probe-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
